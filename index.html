<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Solid Click — Build. Click. Grow.</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black:      #1A1A1A;
      --black-deep: #111111;
      --grey:       #2C2C2C;
      --beige:      #F5F0E6;
      --beige-warm: #E8DCC8;
      --beige-dim:  #B8A99A;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--beige);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Disable custom cursor on touch devices */
    @media (pointer: fine) {
      body {
        cursor: none;
      }
      .cursor, .cursor-ring {
        display: block;
      }
    }
    @media (pointer: coarse) {
      .cursor, .cursor-ring {
        display: none;
      }
    }

    /* ── CUSTOM CURSOR (only for mouse) ── */
    .cursor {
      position: fixed;
      width: 10px; height: 10px;
      background: var(--beige);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
      display: none;
    }
    .cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1px solid rgba(245,240,230,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease, width 0.3s ease, height 0.3s ease;
      display: none;
    }
    @media (pointer: fine) {
      .cursor, .cursor-ring { display: block; }
      body:has(a:hover) .cursor,
      body:has(button:hover) .cursor { width: 16px; height: 16px; background: var(--beige-warm); }
      body:has(a:hover) .cursor-ring,
      body:has(button:hover) .cursor-ring { width: 52px; height: 52px; border-color: var(--beige); }
    }

    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    /* ── GRID LINES ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(245,240,230,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,240,230,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(245,240,230,0.06);
      backdrop-filter: blur(12px);
      background: rgba(26,26,26,0.7);
    }

    .logo {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      position: relative;
    }
    .logo-icon svg { width: 100%; height: 100%; }
    .logo-text {
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--beige);
    }

    .nav-status {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 300;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--beige-dim);
    }
    .status-dot {
      width: 6px; height: 6px;
      background: #8B7355;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── HERO ── */
    .hero {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 100px 24px 60px;
      overflow: hidden;
    }

    .hero-glow {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(184,169,154,0.06) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-eyebrow {
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--beige-dim);
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    .hero-title {
      font-size: clamp(48px, 12vw, 110px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--beige);
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.4s;
    }
    .hero-title span {
      color: var(--beige-warm);
    }

    .hero-tagline {
      font-size: clamp(13px, 4vw, 17px);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--beige-dim);
      margin-top: 28px;
      margin-bottom: 64px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.6s;
    }
    .hero-tagline em {
      font-style: normal;
      color: var(--beige-warm);
    }

    .year-badge {
      display: inline-flex; align-items: center; gap: 16px;
      border: 1px solid rgba(245,240,230,0.12);
      padding: 12px 24px;
      margin-bottom: 60px;
      font-size: 12px; font-weight: 400;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--beige-dim);
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.7s;
      flex-wrap: wrap;
      justify-content: center;
    }
    .year-badge strong {
      color: var(--beige);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.05em;
    }
    .year-line { width: 24px; height: 1px; background: rgba(245,240,230,0.2); }

    /* ── EMAIL FORM ── */
    .email-section {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.9s;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .email-label {
      font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--beige-dim);
      margin-bottom: 16px;
    }
    .email-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border: 1px solid rgba(245,240,230,0.15);
      width: 100%;
    }
    .email-form input {
      flex: 1 1 200px;
      background: transparent;
      border: none; outline: none;
      padding: 14px 20px;
      font-family: 'Sora', sans-serif;
      font-size: 13px; font-weight: 300;
      color: var(--beige);
      letter-spacing: 0.04em;
      min-width: 160px;
    }
    .email-form input::placeholder { color: rgba(245,240,230,0.25); }
    .email-form button {
      background: var(--beige);
      border: none;
      padding: 14px 24px;
      font-family: 'Sora', sans-serif;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--black);
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }
    .email-form button:hover { background: var(--beige-warm); }

    .form-note {
      margin-top: 12px;
      font-size: 10px; letter-spacing: 0.1em;
      color: rgba(245,240,230,0.2);
    }

    /* ── DIVIDER ── */
    .section-divider {
      position: relative; z-index: 2;
      display: flex; align-items: center;
      padding: 0 24px;
      margin: 0 auto;
      max-width: 1100px;
      gap: 16px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.2s;
    }
    .divider-line { flex: 1; height: 1px; background: rgba(245,240,230,0.06); }
    .divider-text {
      font-size: 9px; letter-spacing: 0.3em;
      text-transform: uppercase; color: rgba(245,240,230,0.2);
      white-space: nowrap;
    }

    /* ── SERVICES ── */
    .services {
      position: relative; z-index: 2;
      padding: 60px 24px;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      background: rgba(245,240,230,0.06);
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.3s;
    }
    @media (min-width: 700px) {
      .services {
        grid-template-columns: 1fr 1fr;
        padding: 80px 48px;
      }
    }

    .service-card {
      background: var(--black);
      padding: 36px 28px;
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease;
    }
    @media (min-width: 700px) {
      .service-card { padding: 48px 44px; }
    }
    .service-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(245,240,230,0.03) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .service-card:hover { background: #1E1E1E; }
    .service-card:hover::before { opacity: 1; }

    .service-num {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.3em; color: rgba(245,240,230,0.2);
      margin-bottom: 24px;
    }
    .service-name {
      font-size: 22px; font-weight: 700;
      color: var(--beige);
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .service-desc {
      font-size: 13px; font-weight: 300;
      color: var(--beige-dim);
      line-height: 1.7;
    }
    .service-tag {
      display: inline-block;
      margin-top: 24px;
      font-size: 9px; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245,240,230,0.25);
      border-bottom: 1px solid rgba(245,240,230,0.1);
      padding-bottom: 4px;
    }

    /* ── COUNTDOWN ── */
    .countdown-section {
      position: relative; z-index: 2;
      text-align: center;
      padding: 60px 24px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.5s;
    }
    .countdown-label {
      font-size: 10px; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--beige-dim);
      margin-bottom: 40px;
    }
    .countdown {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }
    .countdown-unit { text-align: center; min-width: 70px; }
    .countdown-num {
      font-size: clamp(36px, 10vw, 72px);
      font-weight: 200;
      color: var(--beige);
      line-height: 1;
      letter-spacing: -0.02em;
      display: block;
    }
    .countdown-unit-label {
      font-size: 9px; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245,240,230,0.25);
      margin-top: 10px;
      display: block;
    }
    .countdown-sep {
      font-size: 48px;
      font-weight: 200;
      color: rgba(245,240,230,0.1);
      line-height: 1;
      align-self: flex-start;
      padding-top: 8px;
    }
    @media (max-width: 550px) {
      .countdown-sep { display: none; }
      .countdown { gap: 16px; }
    }

    /* ── FOOTER ── */
    footer {
      position: relative; z-index: 2;
      padding: 32px 24px;
      border-top: 1px solid rgba(245,240,230,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      text-align: center;
    }
    .footer-brand {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(245,240,230,0.3);
    }
    .footer-founder {
      font-size: 11px; font-weight: 300;
      letter-spacing: 0.1em;
      color: rgba(245,240,230,0.2);
    }
    .footer-founder span { color: rgba(245,240,230,0.5); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .success-msg {
      display: none;
      font-size: 12px; letter-spacing: 0.14em;
      color: var(--beige-warm);
      text-transform: uppercase;
      margin-top: 16px;
    }
    .success-msg.show { display: block; }

    /* extra small fixes */
    @media (max-width: 480px) {
      .hero { padding: 80px 16px 40px; }
      .service-name { font-size: 20px; }
      .service-desc { font-size: 12px; }
      .year-badge { gap: 8px; padding: 10px 16px; font-size: 10px; }
    }
  </style>
</head>

AAAIDNDoM+AAAAAAAANjsM+gAAAAAAANjsMOgDAAAAAABgs8OgDwAAAAAAAJsdBn0AAAAAAADY7DDoAwAAAAAAwGaHQR8AAAAAAAA2Owz6AAAAAAAAsNlh0AcAAAAAAIDNDoM+AAAAAAAANjsM+gAAAAAAANjsMOgDAAAAAABgs8OgDwAAAAAAAJsdBn0AAAAAAADY7DDoAwAAAAAAwGaHQR8AAAAAAAA2Owz6AAAAAAAAsNlh0AcAAAAAAIDNDoM+AAAAAAAANjsM+gAAAAAAANjsMOgDAAAAAABgs8OgDwAAAAAAAJsdBn0AAAAAAADY7DDoAwAAAAAAwGaHQR8AAAAAAAA2Owz6AAAAAAAAsNlh0AcAAAAAAIDNDoM+AAAAAAAANjsM+gAAAAAAANjsMOgDAAAAAABgs8OgDwAAAAAAAJsdBn0AAAAAAADY7DDoAwAAAAAAwGaHQR8AAAAAAAA2Owz6AAAAAAAAsNlh0AcAAAAAAIDNDoM+AAAAAAAANjsM+gAAAAAAANjsMOgDAAAAAABgs8OgDwAAAAAAAJsdBn0AAAAAAADY7DDoAwAAAAAAwGaHQR8AAAAAAAA2Owz6AAAAAAAAsNlh0AcAAAAAAIDNDoM+AAAAAAAANjsM+gAAAAAAANjsMOgDAAAAAABgs8OgDwAAAAAAAJsdBn0AAAAAAADY7DDoAwAAAAAAwGaHQR8AAAAAAAA2Owz6AAAAAAAAsNlh0AcAAAAAAIDNDoM+AAAAAAAANjsM+gAAAAAAANjsMOgDAAAAA<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Solid Click — Build. Click. Grow.</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black:      #1A1A1A;
      --black-deep: #111111;
      --grey:       #2C2C2C;
      --beige:      #F5F0E6;
      --beige-warm: #E8DCC8;
      --beige-dim:  #B8A99A;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--beige);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Disable custom cursor on touch devices */
    @media (pointer: fine) {
      body {
        cursor: none;
      }
      .cursor, .cursor-ring {
        display: block;
      }
    }
    @media (pointer: coarse) {
      .cursor, .cursor-ring {
        display: none;
      }
    }

    /* ── CUSTOM CURSOR (only for mouse) ── */
    .cursor {
      position: fixed;
      width: 10px; height: 10px;
      background: var(--beige);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
      display: none;
    }
    .cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1px solid rgba(245,240,230,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease, width 0.3s ease, height 0.3s ease;
      display: none;
    }
    @media (pointer: fine) {
      .cursor, .cursor-ring { display: block; }
      body:has(a:hover) .cursor,
      body:has(button:hover) .cursor { width: 16px; height: 16px; background: var(--beige-warm); }
      body:has(a:hover) .cursor-ring,
      body:has(button:hover) .cursor-ring { width: 52px; height: 52px; border-color: var(--beige); }
    }

    /* ── NOISE TEXTURE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    /* ── GRID LINES ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(245,240,230,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,240,230,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(245,240,230,0.06);
      backdrop-filter: blur(12px);
      background: rgba(26,26,26,0.7);
    }

    .logo {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      position: relative;
    }
    .logo-icon svg { width: 100%; height: 100%; }
    .logo-text {
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--beige);
    }

    .nav-status {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 300;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--beige-dim);
    }
    .status-dot {
      width: 6px; height: 6px;
      background: #8B7355;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── HERO ── */
    .hero {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 100px 24px 60px;
      overflow: hidden;
    }

    .hero-glow {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(184,169,154,0.06) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-eyebrow {
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--beige-dim);
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    .hero-title {
      font-size: clamp(48px, 12vw, 110px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--beige);
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.4s;
    }
    .hero-title span {
      color: var(--beige-warm);
    }

    .hero-tagline {
      font-size: clamp(13px, 4vw, 17px);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--beige-dim);
      margin-top: 28px;
      margin-bottom: 64px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.6s;
    }
    .hero-tagline em {
      font-style: normal;
      color: var(--beige-warm);
    }

    .year-badge {
      display: inline-flex; align-items: center; gap: 16px;
      border: 1px solid rgba(245,240,230,0.12);
      padding: 12px 24px;
      margin-bottom: 60px;
      font-size: 12px; font-weight: 400;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--beige-dim);
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.7s;
      flex-wrap: wrap;
      justify-content: center;
    }
    .year-badge strong {
      color: var(--beige);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.05em;
    }
    .year-line { width: 24px; height: 1px; background: rgba(245,240,230,0.2); }

    /* ── EMAIL FORM ── */
    .email-section {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.9s;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .email-label {
      font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--beige-dim);
      margin-bottom: 16px;
    }
    .email-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border: 1px solid rgba(245,240,230,0.15);
      width: 100%;
    }
    .email-form input {
      flex: 1 1 200px;
      background: transparent;
      border: none; outline: none;
      padding: 14px 20px;
      font-family: 'Sora', sans-serif;
      font-size: 13px; font-weight: 300;
      color: var(--beige);
      letter-spacing: 0.04em;
      min-width: 160px;
    }
    .email-form input::placeholder { color: rgba(245,240,230,0.25); }
    .email-form button {
      background: var(--beige);
      border: none;
      padding: 14px 24px;
      font-family: 'Sora', sans-serif;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--black);
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }
    .email-form button:hover { background: var(--beige-warm); }

    .form-note {
      margin-top: 12px;
      font-size: 10px; letter-spacing: 0.1em;
      color: rgba(245,240,230,0.2);
    }

    /* ── DIVIDER ── */
    .section-divider {
      position: relative; z-index: 2;
      display: flex; align-items: center;
      padding: 0 24px;
      margin: 0 auto;
      max-width: 1100px;
      gap: 16px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.2s;
    }
    .divider-line { flex: 1; height: 1px; background: rgba(245,240,230,0.06); }
    .divider-text {
      font-size: 9px; letter-spacing: 0.3em;
      text-transform: uppercase; color: rgba(245,240,230,0.2);
      white-space: nowrap;
    }

    /* ── SERVICES ── */
    .services {
      position: relative; z-index: 2;
      padding: 60px 24px;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1px;
      background: rgba(245,240,230,0.06);
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.3s;
    }
    @media (min-width: 700px) {
      .services {
        grid-template-columns: 1fr 1fr;
        padding: 80px 48px;
      }
    }

    .service-card {
      background: var(--black);
      padding: 36px 28px;
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease;
    }
    @media (min-width: 700px) {
      .service-card { padding: 48px 44px; }
    }
    .service-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(245,240,230,0.03) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .service-card:hover { background: #1E1E1E; }
    .service-card:hover::before { opacity: 1; }

    .service-num {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.3em; color: rgba(245,240,230,0.2);
      margin-bottom: 24px;
    }
    .service-name {
      font-size: 22px; font-weight: 700;
      color: var(--beige);
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .service-desc {
      font-size: 13px; font-weight: 300;
      color: var(--beige-dim);
      line-height: 1.7;
    }
    .service-tag {
      display: inline-block;
      margin-top: 24px;
      font-size: 9px; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245,240,230,0.25);
      border-bottom: 1px solid rgba(245,240,230,0.1);
      padding-bottom: 4px;
    }

    /* ── COUNTDOWN ── */
    .countdown-section {
      position: relative; z-index: 2;
      text-align: center;
      padding: 60px 24px;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.5s;
    }
    .countdown-label {
      font-size: 10px; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--beige-dim);
      margin-bottom: 40px;
    }
    .countdown {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }
    .countdown-unit { text-align: center; min-width: 70px; }
    .countdown-num {
      font-size: clamp(36px, 10vw, 72px);
      font-weight: 200;
      color: var(--beige);
      line-height: 1;
      letter-spacing: -0.02em;
      display: block;
    }
    .countdown-unit-label {
      font-size: 9px; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245,240,230,0.25);
      margin-top: 10px;
      display: block;
    }
    .countdown-sep {
      font-size: 48px;
      font-weight: 200;
      color: rgba(245,240,230,0.1);
      line-height: 1;
      align-self: flex-start;
      padding-top: 8px;
    }
    @media (max-width: 550px) {
      .countdown-sep { display: none; }
      .countdown { gap: 16px; }
    }

    /* ── FOOTER ── */
    footer {
      position: relative; z-index: 2;
      padding: 32px 24px;
      border-top: 1px solid rgba(245,240,230,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      text-align: center;
    }
    .footer-brand {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(245,240,230,0.3);
    }
    .footer-founder {
      font-size: 11px; font-weight: 300;
      letter-spacing: 0.1em;
      color: rgba(245,240,230,0.2);
    }
    .footer-founder span { color: rgba(245,240,230,0.5); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .success-msg {
      display: none;
      font-size: 12px; letter-spacing: 0.14em;
      color: var(--beige-warm);
      text-transform: uppercase;
      margin-top: 16px;
    }
    .success-msg.show { display: block; }

    /* extra small fixes */
    @media (max-width: 480px) {
      .hero { padding: 80px 16px 40px; }
      .service-name { font-size: 20px; }
      .service-desc { font-size: 12px; }
      .year-badge { gap: 8px; padding: 10px 16px; font-size: 10px; }
    }
  </style>
</head>
